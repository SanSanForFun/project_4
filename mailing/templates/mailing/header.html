<div class="d-flex flex-column flex-md-row align-items-center pb-3 mb-4 border-bottom">
    <a href="/" class="d-flex align-items-center link-body-emphasis text-decoration-none">
        <span class="fs-4">Сервис управления рассылками</span>
    </a>
    <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
        <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'mailing:mailing_list' %}">Главная</a>
        <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'mailing:attempt_mailing_list' %}">Попытки рассылок</a>
        <a class="me-3 py-2 link-body-emphasis text-decoration-none"
           href="{% url 'mailing:message_list' %}">Сообщения</a>
        <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'mailing:mailing_get_list' %}">Получатель
            рассылки</a>
        {% if user.is_authenticated %}
        <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'users:logout' %}">Выход</a>
        {% else %}
        <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="{% url 'users:login' %}">Вход</a>
        <a class="py-2 link-body-emphasis text-decoration-none" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
