{% extends 'mailing/base.html' %}
{% load my_tags %}
{% block content %}
{% include 'mailing/head_message.html' %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">{{ object.mail_theme }}</p>
                        <p class="card-text">{{ object.mail_body }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="w-100 btn btn-lg btn-outline-primary" href="{% url 'mailing:message_list' %}"
                                   role="button">Назад</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
